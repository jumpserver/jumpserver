# When Django start it will bind this host and port
# ./manage.py runserver 127.0.0.1:8080
# 运行时绑定端口
HTTP_BIND_HOST: 0.0.0.0
HTTP_LISTEN_PORT: 8080
WS_LISTEN_PORT: 8070

# Ansible 单批次超时（一次 ansible-runner 执行，单位：秒）
# 当前资产自动化会按每 80 个资产分批；每批只启动一个 ansible-runner，
# 各批次按顺序执行。一个资产有多个目标账号时，该批实际执行的账号数会更多。
#
# JOB_TIMEOUT：单个 80 资产批次的总时长上限；即使持续有输出，达到该时间也会终止。
#              它不是整个任务的超时。不要仅因任务有 1 万资产就盲目调大；
#              只有单批 P95 耗时接近 1800 秒（30 分钟）时才需要提高。
# IDLE_TIMEOUT：单批连续这么久没有任何 Ansible 事件或输出，就认为批次卡死并终止。
#               通常应保留此保护；只有已确认存在正常的长时间静默操作时再提高。
# 任一项设为 0，只关闭对应的单批限制。
# ANSIBLE_RUNNER_JOB_TIMEOUT: 1800
# ANSIBLE_RUNNER_IDLE_TIMEOUT: 900

# 整个自动化任务的监控与超时（单位：秒）
# STALL_LOG_INTERVAL：每隔多久记录一次仍在执行 task 的主机；只记录，不会终止任务
# TASK_TIMEOUT：每台主机执行单个 Ansible task 的默认最长时间
#               playbook 中为 task 显式设置 timeout 时，以 playbook 为准
# TOTAL_TIMEOUT：整个自动化任务（包括准备、全部批次和写入结果）的最长时间；
#                超时后停止当前及后续批次。大规模改密主要应调整此项。
#
# 大规模改密容量估算（建议先在相同网络和平台上实测）：
# 1. 选择 80 个有代表性的资产，按实际账号数执行一次改密，记录“单批 P95 耗时”。
# 2. 按以下公式设置 TOTAL_TIMEOUT，预留至少 30% 余量：
#      ceil(资产总数 / 80) * 单批 P95 耗时（秒） * 1.3
# 3. 示例：1 万资产、2 万账号约为 125 批。若单批 P95 为 3 分钟，
#    建议至少 32400 秒（9 小时）；若为 5 分钟，建议至少 54000 秒（15 小时）。
#
# 不建议未压测就执行 1 万资产的单个改密任务；可拆为每次约 1000 资产/2000 账号，
# 并串行执行。若需并发多个任务，还应评估 Ansible forks、Celery、Redis、数据库及
# 目标系统的并发连接承载能力。
#
# 1 万资产 / 2 万账号单任务的建议起始值（假定 80 资产单批 P95 不超过 5 分钟）：
# ANSIBLE_RUNNER_JOB_TIMEOUT: 1800        # 单批硬超时：30 分钟
# ANSIBLE_RUNNER_IDLE_TIMEOUT: 900        # 单批无输出超时：15 分钟
# ANSIBLE_STALL_LOG_INTERVAL: 60          # 卡住主机的日志间隔：1 分钟
# ANSIBLE_AUTOMATION_TASK_TIMEOUT: 300    # 单主机单 Ansible task 超时：5 分钟
# ANSIBLE_AUTOMATION_TOTAL_TIMEOUT: 54000 # 公式结果 48750 秒，向上取整为 15 小时
# SSH_GATEWAY_CONNECT_TIMEOUT: 30         # 单次网关连接超时：30 秒
#
# 若单批 P95 约为 3 分钟，可将 TOTAL_TIMEOUT 改为 32400（9 小时）；
# 若单批 P95 超过 5 分钟，则按上面的公式重新计算，不能仍使用 54000。
# 除 TOTAL_TIMEOUT 外，其余值不是按资产总量放大的：只有相应的单批或单主机操作
# 确实会超时时，才提高对应配置。
#
# 设置 TOTAL_TIMEOUT 为 0 会关闭整任务的安全时限；此时改密账号锁最长会保留 24 小时，
# 生产环境通常不建议这样设置。
# 设置为 0 可关闭对应的日志记录或超时限制。
# ANSIBLE_STALL_LOG_INTERVAL: 60
# ANSIBLE_AUTOMATION_TASK_TIMEOUT: 300
# ANSIBLE_AUTOMATION_TOTAL_TIMEOUT: 21600

# SSH 网关连接超时（单位：秒）
# 限制通过网关建隧道时 DNS 解析、TCP 连接、SSH 握手和认证的总等待时间
# 设置为 0 时不增加 JumpServer 的总超时限制，仍受 sshtunnel/Paramiko 默认超时约束
# SSH_GATEWAY_CONNECT_TIMEOUT: 30

# SSH/交换机 remote_client 诊断日志
# 开启后输出已脱敏的连接、切换用户、命令收发和网关阶段信息，并自动传入 Ansible EE
# 仅建议排障时临时开启；可用值：true/false
# JMS_REMOTE_CLIENT_DEBUG: false

# Use Redis as broker for celery and web socket
# Redis配置
REDIS_HOST: 127.0.0.1
REDIS_PORT: 6379
# REDIS_PASSWORD:
# REDIS_DB_CELERY: 3
# REDIS_DB_CACHE: 4

# Vault storage, OpenBao is the default backend when enabled.
# 内置 OpenBao 作为默认 Vault backend；开启后请先确认 OpenBao Server 已完成初始化和授权
# VAULT_ENABLED: true
# VAULT_BACKEND: openbao
# VAULT_OPENBAO_ADDR: http://openbao:8200
# VAULT_OPENBAO_MOUNT_POINT: pam
# VAULT_OPENBAO_TOKEN:
# VAULT_OPENBAO_TIMEOUT: 10

# LDAP/AD settings
# LDAP 搜索分页数量
# AUTH_LDAP_SEARCH_PAGED_SIZE: 1000
#
# 定时同步用户
# 启用 / 禁用
# AUTH_LDAP_SYNC_IS_PERIODIC: True
# 同步间隔 (单位: 时) (优先）
# AUTH_LDAP_SYNC_INTERVAL: 12
# Crontab 表达式
# AUTH_LDAP_SYNC_CRONTAB: * 6 * * *
#
# LDAP 用户登录时仅允许在用户列表中的用户执行 LDAP Server 认证
# AUTH_LDAP_USER_LOGIN_ONLY_IN_USERS: False
#
# LDAP 认证时如果日志中出现以下信息将参数设置为 0 (详情参见：https://www.python-ldap.org/en/latest/faq.html)
# In order to perform this operation a successful bind must be completed on the connection
# AUTH_LDAP_OPTIONS_OPT_REFERRALS: -1

# OTP settings
# OTP/MFA 配置
# OTP_VALID_WINDOW: 0
# OTP_ISSUER_NAME: JumpServer

# 启用定时任务
# PERIOD_TASK_ENABLED: True
#

# 是否开启 Luna 水印
# SECURITY_WATERMARK_ENABLED: False

# 浏览器关闭页面后，会话过期
# SESSION_EXPIRE_AT_BROWSER_CLOSE: False

# 每次 api 请求，session 续期
# SESSION_SAVE_EVERY_REQUEST: True

# 仅允许用户从来源处登录
# ONLY_ALLOW_AUTH_FROM_SOURCE: False

# 仅允许已存在的用户登录，不允许第三方认证后，自动创建用户
# ONLY_ALLOW_EXIST_USER_AUTH: False

