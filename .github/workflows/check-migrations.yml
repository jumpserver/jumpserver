name: Check migration numbers

on:
  pull_request:
    branches: ['dev']
  push:
    branches: ['dev']
    paths:
      - 'apps/**/migrations/**'
      - 'utils/check_migrations.py'
      - 'apps/common/migration_checks.py'
      - '.github/workflows/check-migrations.yml'

permissions:
  contents: read

jobs:
  migration-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check duplicate migration numbers
        run: python utils/check_migrations.py
