on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release And Upload assets

permissions:
  contents: write

jobs:
  create-realese:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Get version
        id: get_version
        run: |
          TAG=$(basename ${GITHUB_REF})
          VERSION=${TAG/v/}
          wget https://raw.githubusercontent.com/jumpserver/installer/master/quick_start.sh
          sed -i "s@VERSION=dev@VERSION=v${VERSION}@g" quick_start.sh
          echo "::set-output name=TAG::$TAG"
          echo "::set-output name=VERSION::$VERSION"
      - name: Create Release
        id: create_release
        uses: release-drafter/release-drafter@09c613e259eb8d4e7c81c2cb00618eb5fc4575a7 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-config.yml
          version: ${{ steps.get_version.outputs.TAG }}
          tag: ${{ steps.get_version.outputs.TAG }}
      - name: Upload Quick Start Script
        id: upload-release-quick-start-shell
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
          RELEASE_UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          if [[ -z "$RELEASE_ID" || -z "$RELEASE_UPLOAD_URL" ]]; then
            echo "::error::Release Drafter did not return a release ID and upload URL"
            exit 1
          fi

          upload_url=${RELEASE_UPLOAD_URL%%\{*}
          if upload_error=$(gh api --method POST --silent \
            -H 'Content-Type: application/text' --input quick_start.sh \
            "${upload_url}?name=quick_start.sh" 2>&1); then
            exit 0
          fi

          # A rerun or a lost upload response can leave the correct asset in place.
          release_api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases"
          if asset_id=$(gh api --paginate "$release_api/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "quick_start.sh" and .state == "uploaded") | .id') &&
            [[ -n "$asset_id" ]] &&
            gh api -H 'Accept: application/octet-stream' "$release_api/assets/$asset_id" |
              cmp -s quick_start.sh -; then
            echo "The release already contains the same quick_start.sh"
            exit 0
          fi

          printf '%s\n' "$upload_error" >&2
          echo "::error::Could not upload quick_start.sh or verify an identical existing asset"
          exit 1

  build-and-release:
    needs: create-realese
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Build it and upload
        uses: jumpserver/action-build-upload-assets@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-realese.outputs.upload_url }}
