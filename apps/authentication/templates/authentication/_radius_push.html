{% load i18n %}
<div id="radius-push"
     data-type="{{ backend.name }}"
     data-url="{% url 'authentication:login-radius-push' %}"
     data-login="{% url 'authentication:login' %}"
     data-attempt="{{ radius_push_attempt_id|default:'' }}"
     data-pending="{% trans 'Approve the sign-in request in your app.' %}"
     data-rejected="{% trans 'The RADIUS server rejected the request.' %}"
     data-timed-out="{% trans 'The push request timed out. Try again.' %}"
     data-cancelled="{% trans 'Push request cancelled.' %}"
     data-rate-limited="{% trans 'Wait before sending another push notification.' %}"
     data-failed="{% trans 'Could not verify the push request. Try again.' %}">
    <p id="radius-push-status" role="status" aria-live="polite"></p>
    <button id="radius-push-send" type="button" class="btn btn-primary block full-width m-b">
        {% trans 'Send push' %}
    </button>
    <button id="radius-push-cancel" type="button" class="btn btn-default block full-width m-b" hidden>
        {% trans 'Cancel' %}
    </button>
</div>
