{% extends '_base_only_content.html' %}
{% load i18n %}
{% load static %}

{% block content %}

    {% if 'code' in form.errors %}
        <div class="alert  alert-danger" id="messages">
            <p class="red-fonts">{{ form.code.errors.as_text }}</p>
        </div>
    {% endif %}

    <div id="retry_container" style="text-align: center; margin-top: 20px; display: none;">
        <p id="retry_message" class="text-muted" style="margin-bottom: 12px;"></p>
        <button id="retry_button" class="btn btn-primary">{% trans 'Retry' %}</button>
    </div>

    <form class="m-t" role="form" method="post" action="" style="display: none">
        {% csrf_token %}
        <button id="submit_button" type="submit" style="display: none"></button>
    </form>

    <div id="iframe_container"
         style="display: none; justify-content: center; align-items: center; height: 520px; width: 100%;">
        <iframe
                title="face capture"
                id="face_capture_iframe"
                allow="camera"
                sandbox="allow-scripts allow-same-origin"
                style="width: 100%; height:100%;border: none;">
        </iframe>
    </div>



    <script>
        $(document).ready(function () {
            const apiUrl = "{% url 'api-auth:face-context' %}";
            const coreIndex = window.location.pathname.indexOf('/core/');
            const sitePrefix = coreIndex > 0 ? window.location.pathname.slice(0, coreIndex) : '';
            const faceCaptureUrl = `${sitePrefix}/luna/facelive/capture`;
            const faceFrame = document.getElementById('face_capture_iframe');
            let token = '';
            let statusTimer = null;
            let statusRequestPending = false;
            let captureGeneration = 0;

            function stopCheckingStatus() {
                if (statusTimer) {
                    clearInterval(statusTimer);
                    statusTimer = null;
                }
                statusRequestPending = false;
            }

            function showRetry(message) {
                stopCheckingStatus();
                $('#iframe_container').hide();
                $('#face_capture_iframe').attr('src', 'about:blank');
                $('#retry_message').text(message || "{% trans 'Face recognition failed' %}");
                $('#retry_container').show();
            }

            function createFaceCaptureToken() {
                stopCheckingStatus();
                const generation = ++captureGeneration;
                $('#retry_container').hide();
                $('#retry_message').text('');
                let prefix = getCookie('SESSION_COOKIE_NAME_PREFIX');
                if (!prefix || [`""`, `''`].includes(prefix)) {
                    prefix = '';
                }
                const csrf = getCookie(`${prefix}csrftoken`);
                $.ajax({
                    url: apiUrl,
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrf
                    },
                    success: function (data) {
                        if (generation !== captureGeneration) {
                            return;
                        }
                        token = data.token;
                        $('#face_capture_iframe').attr('src', `${faceCaptureUrl}?token=${encodeURIComponent(token)}`);
                        $('#iframe_container').css('display', 'flex');
                        startCheckingStatus(generation, token);
                    },
                    error: function () {
                        if (generation !== captureGeneration) {
                            return;
                        }
                        showRetry("{% trans 'Failed to start face recognition' %}");
                    }
                });
            }

            function startCheckingStatus(generation, captureToken) {
                const interval = 1000;
                statusTimer = setInterval(function () {
                    if (generation !== captureGeneration) {
                        return;
                    }
                    if (statusRequestPending) {
                        return;
                    }
                    statusRequestPending = true;
                    $.ajax({
                        url: `${apiUrl}?token=${encodeURIComponent(captureToken)}`,
                        method: 'GET',
                        success: function (data) {
                            if (generation !== captureGeneration) {
                                return;
                            }
                            if (data.is_finished) {
                                stopCheckingStatus();
                                if (data.success) {
                                    $('#submit_button').click();
                                } else {
                                    showRetry(data.error_message);
                                }
                            }
                        },
                        error: function (error) {
                            if (generation !== captureGeneration) {
                                return;
                            }
                            if (error.status === 403 || error.status === 404) {
                                showRetry("{% trans 'Face capture expired. Please retry.' %}");
                            }
                        },
                        complete: function () {
                            if (generation === captureGeneration) {
                                statusRequestPending = false;
                            }
                        }
                    });
                }, interval);
            }

            const active = "{{ active }}";
            if (active) {
                createFaceCaptureToken();
            } else {
                showRetry("{% trans 'Face recognition failed' %}");
            }

            $('#retry_button').on('click', function () {
                createFaceCaptureToken();
            });

            window.addEventListener('message', function (event) {
                if (event.origin !== window.location.origin || event.source !== faceFrame.contentWindow) {
                    return;
                }
                const message = event.data;
                if (message?.source === 'jumpserver-facelive' && message.event === 'retry_requested') {
                    createFaceCaptureToken();
                }
            });
            window.addEventListener('beforeunload', stopCheckingStatus);
        });
    </script>
{% endblock %}
