{% extends '_base_only_content.html' %}
{% block html_title %}{{ title }}{% endblock %}
{% block title %}{{ title }}{% endblock %}

{% block custom_head_css_js %}
<style>
    .sso-error-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        margin-bottom: 20px;
        border-radius: 50%;
        color: #b7791f;
        background: #fff4df;
        font-size: 22px;
    }
    .sso-error-message { color: #303133; font-size: 16px; line-height: 1.8; }
    .sso-error-help { color: #767676; line-height: 1.8; margin: 12px 0 24px; }
    .sso-error-action { display: inline-block; padding: 10px 24px; }
    @media (max-width: 480px) {
        .passwordBox { padding-top: 48px; }
        .sso-error-action { width: 100%; }
    }
</style>
{% endblock %}

{% block content %}
<div class="sso-error-icon" aria-hidden="true"><i class="fa fa-chain-broken"></i></div>
<p class="sso-error-message">{{ message }}</p>
<p class="sso-error-help">{{ help_text }}</p>
<a href="{{ login_url }}" class="btn btn-primary sso-error-action">{{ login_label }}</a>
{% endblock %}
