# ── 系统级证书配置 ─────────────────────────────────────────────────────────────
# 所有与证书认证相关的系统配置均放在 cert: 段，其余 key 为厂商 SDK 方法映射。
cert:
  # Challenge 码在 Redis 中的存活时间（秒）
  challenge_ttl: 300
  # 证书签发配置
  enroll:
    enabled: true
    key_algo: SM2          # 签发密钥算法：SM2 或 RSA
    validity_days: 365     # 签发证书的有效期（天）
  pin:
    default: "88888888"

showBasicInfo:
  # 基础加密操作
  - version: 
      label: 版本
      method: 
        call: UKey_GetVersion
      description: 获取 USB Key 驱动版本
  - devSN: 
      label: 设备序列号
      method: 
        call: UKey_GetDevSN
      description: 获取设备序列号
  - enrollEnabled:
      label: 制证功能
      value: 启用
      description: 是否启用制证功能
      only: admin
  - enrollKeyAlgo:
      label: 制证算法
      value: SM2
      description: 制证使用的密钥算法
      only: admin
  - enrollValidityDays:
      label: 证书期限
      value: 365 天
      description: 制证使用的证书有效期
      only: admin

# ── 厂商 USB Key SDK 方法映射 ──────────────────────────────────────────────────
# USB Key 厂商 SDK 方法名映射

# Driver 初始化
newUKeyAPI: 
  description: 初始化 USB Key SDK，获取 SDK 对象实例
  method:
    call: UKeyAPI

# 基本操作
checkInstall: 
  description: 检查 USB Key 驱动是否安装
  method: 
    call: UKey_CheckInstall

# 获取用户名
getCertCN: 
  description: 获取 USB Key 内置用户名
  method: 
    call: UKey_GetCertInfo
    params:
      - key: CERT_TYPE_SIGN
        value: 1
      - key: CERT_SUBJECT_CN
        value: 9
  
# 管理员重置 PIN
adminResetPIN:
  description: 重置 PIN
  method: 
    call: UKey_UnblockPIN
    params:
      - key: admin_pin
        value: '{{ input.admin_pin }}'
      - key: usb_key_pin
        value: '{{ output.default_pin }}'

# 用户修改 PIN
userChangePIN:
  description: 用户修改 PIN
  method:
    call: UKey_ChangePIN
    params:
      - key: old_pin
        value: '{{ input.old_pin }}'
      - key: new_pin1
        value: '{{ input.new_pin1 }}'
    result:
      success: 0

# 清除证书
deleteCert: 
  description: 删除已有证书
  method: 
    call: UKey_DeleteCons

# 校验 PIN
checkPIN:
  description: 校验 PIN 是否正确
  method: 
    call: UKey_VerifyPIN
    params:
      - key: pin
        value: '{{ input.login_pin }}'
    result: 
      success: 0

# 获取公钥
getCert: 
  description: 获取证书
  method: 
    call: UKey_GetCert
    params:
      - key: CERT_TYPE_SIGN
        value: 1

# 签名数据
signData: 
  description: 使用 USB Key 内的私钥对数据进行签名
  method: 
    call: UKey_SignData
    params:
      - key: SM3
        value: 1
      - key: challenge_code
        value: '{{ output.challenge_code }}'

getCertInfo: 
  description: 获取证书列表（包含证书信息）
  method: 
    call: UKey_GetCertInfoList
  fields:
    - ID: 
        key: ID
        label: 证书 ID
    - CN: 
        key: CN
        label: CN (ID)
    - DN:
        key: DN
        label: DN
    - SN:
        key: SN
        label: SN
    - bef: 
        key: bef
        label: bef
    - aft: 
        key: aft
        label: aft
    - isSM: 
        key: isSM
        label: 国密证书
    - DEVSN:
        key: DEVSN
        label: 设备序列号
  showFields: [ID, CN, DN, SN, bef, aft, isSM, DEVSN]

# 制证流程（Enrollment）
# 步骤顺序：1 → 2 → 3 → 4（服务端签发）→ 5
enrollSteps:
  # 制证前清除旧证书，避免容器满
  - deleteCert: 
      description: 删除已有证书
      method: 
        call: UKey_DeleteCons

  # 在 USB Key 硬件内生成密钥对（私钥永不离开设备）
  - genKeyPair: 
      description: 生成密钥对
      method: 
        call: UKey_GenKeyPair
        params: 
          - key: asymAlg
            label: 非对称算法
            type: int
            value: 1  # SM2

  # 用 USB Key 内的私钥生成 CSR（包含公钥 + Subject 信息）
  - genCSR: 
      description: 生成证书签名请求 (CSR)
      method: 
        call: UKey_GenCSR
        params:
          - key: dn
            label: 证书主题 (Subject DN)
            type: string
            items: 
              - key: CN
                label: 名称 (CN)
                value: '{{ user.username }}'  # 从配置读取 Subject CN 字段
              - key: OU
                label: 其他信息
                value: '{{ settings.VENDOR }}'  # 从配置读取 Subject O 字段

  - signCert:
      description: 证书签发

  # 服务端 CA 签发证书后，将证书写入 USB Key
  - writeCert: 
      description: 写入证书
      method: 
        call: UKey_ImportCertAndKeyPair
        params:
          - key: SignCert
            type: string
            value: '{{ output.signed_cert }}'  # 从服务端签发结果读取签名证书
          - key: EncCert
            value: ''
          - key: EncKeyPair
            value: ''
