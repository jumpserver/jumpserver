#═══════════════════════════════════════════════════════════════════════════════
# UKey 驱动配置 — Schema v2.0
# 后端将此文件解析后以 JSON 格式响应 /api/v1/authentication/cert/vendor-driver-config/
#═══════════════════════════════════════════════════════════════════════════════

# ── 元信息 ──────────────────────────────────────────────────────────────────────
meta:
  vendor: "吉大"
  version: "1.0.0"
  description: "吉大 UKey Web SDK 配置"

# - 配置信息 
config:
  # 非对称密钥的算法
  asymAlg: 
    SM2: 1
    RSA-1024: 2
    RSA-2048: 3
    default: 1
  # 密钥类型
  keySpec: 1  # 1 表示签名密钥
  # 证书类型
  certType: 1 # 1 表示签名证书
  # 摘要签名算法
  digestAlg:
    SM2: 1
    RSA-1024: 4
    RSA-2048: 4
    default: 1
  poll_interval: 3000  # 轮询检测设备的时间间隔，单位毫秒

#═══════════════════════════════════════════════════════════════════════════════
# sdk: SDK 脚本加载、实例创建、初始化步骤
#
# 变量命名空间:
#   {{ ukey.* }}      — sdk.setup.steps 中通过 register 注册的持久变量
#                       生命周期与驱动实例相同，所有操作均可读取
#   {{ vars.* }}      — 操作执行期间各步骤通过 register 注册的临时变量
#                       生命周期仅限当次操作
#   {{ input.* }}     — 当前步骤 input 对话框收集的用户输入
#   {{ user.* }}      — 组件 object prop 中的用户对象字段（如 user.username, user.id）
#   {{ settings.* }}  — 后端 publicSettings 中的全局配置项
#   {{ config.* }}    — 后端响应中 config 段的字段（如 config.enroll.enabled, config.pin.default）
#═══════════════════════════════════════════════════════════════════════════════
sdk:

  # 构造 UKey SDK 实例
  create:
    constructor: "UKeyAPI"   # 脚本加载后挂载到 window 的构造函数名
    args: ['UKeyPlugin']                      # 传给构造函数的参数列表

  # 实例创建后执行的初始化步骤（同步，顺序执行）
  # 各厂商按需配置，步骤可多可少，结果通过 register 写入 ukey.* 供后续操作使用
  # 若厂商 SDK 无需初始化步骤，可将 steps 配为空列表或省略整个 setup 块
  setup:
    steps:
      - name: checkInstall
        label: "检测设备安装"
        call: UKey_CheckInstall
        args: []

      - name: getDevSN
        label: "获取设备序列号"
        call: UKey_GetDevSN
        args: []
        register: ukey.devSN 

      - name: getDevVersion
        label: "获取设备版本"
        call: UKey_GetVersion
        args: []
        scope: both
        register: ukey.devVersion 

#═══════════════════════════════════════════════════════════════════════════════
# info: 展示信息字段定义（只读，不修改设备状态）
#
# 每个字段取值方式（二选一，call 优先级高于 value）：
#   call + args — 调用 UKey 方法，返回值作为显示内容
#   value       — 直接写固定字符串，或 {{ }} 模板引用变量
#
# scope 可选值:
#   both  — 管理员与用户均可见（默认）
#   admin — 仅管理员可见
#   user  — 仅用户可见
#═══════════════════════════════════════════════════════════════════════════════
info:

  # 左上「设备驱动状态」区域的动态字段（固定字段由页面内置）
  device:
    - key: vendor
      label: "设备厂商"
      scope: admin
      value: "吉大"

    - key: ukeyConnected
      label: "设备状态"
      scope: both
      source: "{{ ukey.devSN }}"
      status:
        cases:
          - match: truthy
            text: "已连接"
            type: success
            value: true
          - match: falsy
            text: "未连接"
            type: danger
            value: false
      register: ukey.connected

    - key: devVersion
      label: "设备版本"
      scope: both
      value: "{{ ukey.devVersion }}"

    - key: devSN
      label: "设备序列号"
      scope: both
      value: "{{ ukey.devSN }}"

    - key: userUKeySN
      label: "用户绑定的设备序列号"
      scope: both
      value: "{{ user.ukey_sn }}"
      compare: "{{ ukey.devSN }}"

    - key: asymAlgName
      label: "非对称算法"
      scope: both
      value: "{{ config.asymAlgName }}"
      hidden: "{{ !config.enroll.enabled }}"  # config.enroll.enabled 为 false 时隐藏此字段

    - key: enrollValidityDays
      label: "证书签发有效期（天）"
      scope: admin
      value: "{{ config.enroll.validity_days }}"
      hidden: "{{ !config.enroll.enabled }}"  # config.enroll.enabled 为 false 时隐藏此字段

  # 右上「证书信息」区域的字段，每个字段单独调用 SDK 方法或写固定 value 获取
  # 取值方式（二选一，call 优先级高于 value）：
  #   call + args — 调用 UKey 方法，返回值作为显示内容
  #   value       — 直接写固定字符串，或 {{ }} 模板引用变量
  cert:
    - key: CERT_SUBJECT_CN
      label: "证书拥有者 CN"
      call: UKey_GetCertInfo
      args: 
        - "{{ config.certType }}"  # 证书类型参数
        - 9
      compare: "{{ user.username }}"  # 将此字段的值与 user.username 比对
    
    - key: CERT_SUBJECT_O
      label: "证书拥有者 O"
      call: UKey_GetCertInfo
      args: 
        - "{{ config.certType }}"  # 证书类型参数
        - 10

    - key: CERT_SUBJECT_OU
      label: "证书拥有者 OU"
      call: UKey_GetCertInfo
      args:
        - "{{ config.certType }}"  # 证书类型参数
        - 11

    - key: CERT_VERSION
      label: "证书版本"
      call: UKey_GetCertInfo
      args:
        - "{{ config.certType }}"  # 证书类型参数
        - 1

    - key: CERT_SERIAL
      label: "证书序列号"
      call: UKey_GetCertInfo
      args:
        - "{{ config.certType }}"  # 证书类型参数
        - 2

    - key: CERT_START_TIME
      label: "证书开始时间"
      call: UKey_GetCertInfo
      args:
        - "{{ config.certType }}"  # 证书类型参数
        - 3

    - key: CERT_END_TIME
      label: "证书结束时间"
      call: UKey_GetCertInfo
      args:
        - "{{ config.certType }}"  # 证书类型参数
        - 4

    - key: CERT_DER_PUBLIC_KEY
      label: "证书公钥（DER）"
      call: UKey_GetCertInfo
      args:
        - "{{ config.certType }}"  # 证书类型参数
        - 5

    - key: CERT_ISSUER_CN
      label: "证书颁发者 CN"
      call: UKey_GetCertInfo
      args:
        - "{{ config.certType }}"  # 证书类型参数
        - 6

    - key: CERT_ISSUER_O
      label: "证书颁发者 O"
      call: UKey_GetCertInfo
      args:
        - "{{ config.certType }}"  # 证书类型参数
        - 7

    - key: CERT_ISSUER_OU
      label: "证书颁发者 OU"
      call: UKey_GetCertInfo
      args:
        - "{{ config.certType }}"  # 证书类型参数
        - 8

#═══════════════════════════════════════════════════════════════════════════════
# operations: 操作按钮列表（顺序即按钮排列顺序）
#
# 每个操作的顶层字段:
#   key      — 唯一标识符
#   label    — 按钮文字 & 操作名称
#   hint     — 按钮下方的补充说明
#   btnType  — Element UI 按钮类型: primary | success | warning | danger | info
#   scope    — 可见范围: admin | user | both（默认 both）
#   hidden   — 是否隐藏按鈕，支持布尔或 {{ }} 模板（解析为真就隐藏）
#             例如: hidden: "{{ config.enroll.enabled }}" 为 false 时显示按鈕
#   confirm  — 操作前弹出确认框（非步骤级）
#   steps    — 步骤列表（顺序执行）
#
# 步骤字段:
#   name       — 步骤标识（用于日志显示）
#   label      — 步骤名称
#   call       — 调用 UKey 实例的方法名（type 不为 api 时使用）
#   type       — 步骤类型: api（HTTP 请求）或 ukey（默认，UKey 方法调用）
#   args       — 参数列表（支持模板字符串和复杂对象）
#   input      — 步骤执行前弹出输入对话框
#   register   — 将返回值注册到指定命名空间（ukey.* 或 vars.*）
#   on_error   — 错误处理策略: skip（跳过此步骤继续）或默认（中止操作）
#   check      — 校验步骤返回值，失败则中止（除非 on_error: skip）
#                简写形式:  check: "{{ result === 0 }}"
#                完整形式:  check:
#                             expr: "{{ result === 0 }}"
#                             message: "失败，错误码: {{ result }}"
#                result 为步骤实际返回值，可在 expr / message 中使用
#
# 参数复杂对象格式:
#   { type: csv,  value: { key1: tpl, ... } }  →  "key1=val1,key2=val2"
#   { type: json, value: { key1: tpl, ... } }  →  '{"key1":"val1"}'
#═══════════════════════════════════════════════════════════════════════════════
operations:

  - key: bindUserUKeySN
    label: "绑定设备"
    hint: "为当前用户绑定 UKey 设备的序列号，一个用户仅能绑定一个 UKey，绑定后当前用户只能使用绑定的 UKey 登录"
    btnType: primary
    scope: admin
    event: refresh.info.device
    steps:
      - name: inputUKeySN
        label: "输入设备序列号"
        input:
          title: "绑定用户设备序列号"
          fields:
            - key: ukeySN
              label: "设备序列号"
              type: text
              value: "{{ ukey.devSN }}"
              required: true

      - name: bindUserUKeySN
        label: "绑定设备"
        type: api
        method: patch
        url: "{{ config.api.bind_user_ukey_sn_url }}"
        body:
          user_id: "{{ user.id }}"
          ukey_sn: "{{ input.ukeySN }}"
      
      - name: refreshUserInfo
        label: "刷新用户信息"
        type: api
        method: get
        url: "{{ config.api.user_detail_url }}"
        url_format: 
          user_id: "{{ user.id }}"
        register: user

  - key: issueCert
    label: "签发证书"
    hint: "为 UKey 生成密钥对并签发数字证书"
    btnType: primary
    scope: admin    
    hidden: "{{ !config.enroll.enabled }}"  # config.enroll.enabled 为 false 时隐藏此按鈕
    disabled: "{{ !ukey.connected }}"
    event: refresh.info.cert
    steps:
      - name: verifyUKeyUserPassword
        label: "验证 UKey 用户密码"
        input: 
          title: "验证 UKey 用户密码"
          fields:
            - key: userPassWd
              label: "UKey 用户密码"
              type: password
        call: UKey_VerifyPIN
        args:
          - "{{ input.userPassWd }}"
        check:
          expr: "{{ result === 0 }}"
          message: "用户认证失败，错误码: {{ result }}"

      - name: genKeyPair
        label: "生成密钥对"
        call: UKey_GenKeyPair
        args:
          - "{{ config.asymAlg }}"  # asymAlg 参数

      - name: genCSR
        label: "生成证书申请"
        call: UKey_GenCSR
        args:
          - type: json
            value:
              CN: "{{ user.username }}"
              O: "{{ settings.VENDOR }}"
        register: vars.csr

      - name: signCert
        label: "服务器签发证书"
        type: api
        method: post
        url: "{{ config.api.enroll_cert_url }}"
        body:
          user_id: "{{ user.id }}"
          csr: "{{ vars.csr }}"
        register: vars.certData

      - name: importCert
        label: "导入证书到设备"
        call: UKey_ImportCertAndKeyPair
        args: 
          - "{{ vars.certData.signed_cert }}"
          - ""
          - ""

  - key: deleteCert
    label: "删除证书"
    hint: "永久删除 UKey 中的数字证书，操作不可逆"
    btnType: danger
    scope: admin
    hidden: "{{ !config.enroll.enabled }}"  # config.enroll.enabled 为 false 时隐藏此按鈕
    disabled: "{{ !ukey.connected }}"
    event: refresh.info.cert
    confirm:
      title: "删除证书确认"
      message: "确认要删除 UKey 中的证书吗？此操作不可逆。"
      type: warning
    steps:
      - name: verifyUKeyUserPassword
        label: "验证 UKey 用户密码"
        input: 
          title: "验证 UKey 用户密码"
          fields:
            - key: userPassWd
              label: "UKey 用户密码"
              type: password
        call: UKey_VerifyPIN
        args:
          - "{{ input.userPassWd }}"
        check:
          expr: "{{ result === 0 }}"
          message: "用户认证失败，错误码: {{ result }}"

      - name: deleteCert
        label: "删除设备证书"
        call: UKey_DeleteCons
        args: []

  - key: resetPin
    label: "重置 PIN"
    hint: "使用管理员权限将 PIN 码重置为系统默认值"
    btnType: warning
    scope: admin
    disabled: "{{ !ukey.connected }}"
    steps:
      - name: resetPin
        label: "重置 PIN"
        input:
          title: "管理员认证"
          fields:
            - key: adminPin
              label: "管理员 PIN"
              type: password
        call: UKey_UnblockPIN
        args:
          - "{{ input.adminPin }}"
          - "{{ config.pin.default }}"
        check:
          expr: "{{ result === 0 }}"
          message: "管理员认证失败，错误码: {{ result }}"
    
  - key: changePin
    label: "修改 PIN"
    hint: "修改 UKey 的用户 PIN 码"
    btnType: info
    scope: both
    disabled: "{{ !ukey.connected }}"
    steps:
      - name: changePin
        label: "修改 PIN"
        input:
          title: "修改 UKey PIN 码"
          fields:
            - key: oldPin
              label: "旧 PIN"
              type: password
            - key: newPin
              label: "新 PIN"
              type: password
            - key: newPin2
              label: "确认 PIN"
              type: password
              validate:
                equals: newPin              # 必须与 newPin 字段值相同
                message: "两次输入的 PIN 码不一致"
        call: UKey_ChangePIN
        args:
          - "{{ input.oldPin }}"
          - "{{ input.newPin }}"


#═══════════════════════════════════════════════════════════════════════════════
# login: 登录页面流程配置
#
# detect.steps  — 轮询检测设备插入状态（步骤失败视为未插入）
#   步骤执行成功后 ukey.certCN 应被注册，用于自动填充用户名输入框
#
# steps         — 点击「登录」后顺序执行的步骤
#   支持与 operations 相同的步骤字段（call / args / input / register / check）
#   特殊 type: submit — 填充表单字段并提交（字段名对应 id_<name> 输入框）
#
# 登录流程可用命名空间:
#   {{ input.pin }}     — 用户在 PIN 输入框中填写的值
#   {{ ukey.cert }}     — detect.steps 中注册的证书（供 submit 步骤引用）
#   {{ vars.* }}        — 步骤间临时变量（每次登录重置）
#   {{ challenge }}     — 服务端下发的挑战码
#═══════════════════════════════════════════════════════════════════════════════
login:

  # 轮询检测设备 — 步骤失败则视为设备未插入
  detect:
    steps:
      - name: getCert
        label: "获取证书"
        call: UKey_GetCert
        args:
          - "{{ config.certType }}"  # 证书类型参数
        register: ukey.cert
        check:
          expr: "{{ result != null && result !== '' }}"
          message: "未检测到证书"

      - name: getCertCN
        label: "证书拥有者 CN"
        call: UKey_GetCertInfo
        args: 
          - "{{ config.certType }}"  # 证书类型参数
          - 9
        register: ukey.certCN
        check:
          expr: "{{ result != null && result !== '' }}"
          message: "获取证书 CN 失败"

  # 登录步骤
  steps:
    - name: verifyPin
      label: "验证 PIN"
      call: UKey_VerifyPIN
      args:
        - "{{ input.pin }}"
      check:
        expr: "{{ result === 0 }}"
        message: "PIN 验证失败，错误码: {{ result }}"
    
    - name: signChallenge
      label: "签名挑战码"
      call: UKey_SignData
      args:
        - "{{ config.digestAlg }}"
        - "{{ challenge.code_base64 }}"
      register: vars.signature
      check:
        expr: "{{ vars.signature !== null && vars.signature !== '' }}"
        message: "签名失败，错误码: {{ result }}"

    - name: submit
      label: "提交登录"
      type: submit
      fields:
        signature: "{{ vars.signature }}"
        cert: "{{ ukey.cert }}"
        username: "{{ ukey.certCN }}"  # 可选，自动填充用户名输入框
        ukey_sn: "{{ ukey.devSN }}"

