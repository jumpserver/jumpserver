- hosts: all
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ local_python_interpreter }}"
  tasks:
    - name: Database account provisioning
      database_automation:
        database_type: "{{ jms_asset.type }}"
        login_host: "{{ jms_asset.address }}"
        login_port: "{{ jms_asset.port }}"
        login_user: "{{ jms_account.username }}"
        login_password: "{{ jms_account.secret }}"
        login_database: "{{ jms_asset.spec_info.db_name | default('') }}"
        connection_options: "{{ jms_asset.database_options }}"
        connect_timeout: 15
        action: push_account
        name: "{{ account.username }}"
        secret_type: "{{ account.secret_type | default('password') }}"
        host: "{{ (params | default({})).account_host | default('%') }}"
        password: "{{ account.secret }}"
      no_log: true
      ignore_errors: true
      register: change_secret_result

    - name: Verify the new credential
      database_automation:
        database_type: "{{ jms_asset.type }}"
        login_host: "{{ jms_asset.address }}"
        login_port: "{{ jms_asset.port }}"
        login_user: "{{ account.username }}"
        login_password: "{{ account.secret }}"
        login_database: "{{ jms_asset.spec_info.db_name | default('') }}"
        connection_options: "{{ jms_asset.database_options }}"
        connect_timeout: 15
        action: ping
      no_log: true
      when: check_conn_after_change or change_secret_result.failed | default(false)
      ignore_errors: true
      register: verify_secret_result

    - name: Preserve an inconclusive credential change
      ansible.builtin.set_fact:
        jms_credential_probe:
          auth_status: unknown
          reason_code: DATABASE_VERIFY_FAILED
          change_succeeded: true
      when:
        - not (change_secret_result.failed | default(false))
        - verify_secret_result.failed | default(false)

    - name: Fail when the change and the new credential verification both fail
      ansible.builtin.fail:
        msg: "Database credential change and verification failed; check database permissions and connectivity"
      when:
        - change_secret_result.failed | default(false)
        - verify_secret_result.failed | default(false)
