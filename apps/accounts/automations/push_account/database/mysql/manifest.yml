id: push_account_mysql
name: "{{ 'MySQL account push' | trans }}"
category: database
type:
  - mysql
  - mariadb
method: push_account
params:
  - name: account_host
    type: str
    label: MySQL account host
    default: "%"
    help_text: Host part of the MySQL account identity
  - name: all_hosts
    type: bool
    label: Apply to all hosts
    default: false
    help_text: Apply the operation to every Host entry with this username

i18n:
  MySQL account push:
    zh: 使用 Ansible 模块 mysql 执行 MySQL 账号推送
    ja: Ansible mysql モジュールを使用してアカウントをプッシュする
    en: Using Ansible module mysql to push account
