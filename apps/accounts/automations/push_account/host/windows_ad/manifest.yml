id: push_account_ad_windows
name: "{{ 'Windows account push' | trans }}"
version: 1
method: push_account
category:
  - ds
type:
  - windows_ad
params:
  - name: groups
    type: str
    label: "{{ 'Params groups label' | trans }}"
    default: 'Users,Remote Desktop Users'
    help_text: "{{ 'Params groups help text' | trans }}"

i18n:
  Windows account push:
    zh: '使用 Ansible 模块 win_domain_user 执行 Windows 账号推送'
    ja: 'Ansible win_domain_user モジュールを使用して Windows アカウントをプッシュする'
    en: 'Using Ansible module win_domain_user to push account'

    es: Usar el módulo Ansible win_domain_user para aprovisionar la cuenta
    ko: Ansible win_domain_user 모듈을 사용하여 계정 푸시
    pt-br: Usar o módulo Ansible win_domain_user para enviar a conta
    ru: Использовать модуль Ansible win_domain_user, чтобы добавить учетную запись
    vi: Sử dụng mô-đun Ansible win_domain_user để đẩy tài khoản
    zh-hant: 使用 Ansible 模組 win_domain_user 執行 Windows 帳號推送
  Params groups help text:
    zh: '请输入用户组，多个用户组使用逗号分隔（需填写已存在的用户组）'
    ja: 'グループを入力してください。複数のグループはコンマで区切ってください（既存のグループを入力してください）'
    en: 'Please enter the group. Multiple groups are separated by commas (please enter the existing group)'

    es: Introduzca los grupos existentes separados por comas
    ko: 기존 그룹을 입력하세요. 여러 그룹은 쉼표로 구분합니다
    pt-br: Insira os grupos existentes separados por vírgulas
    ru: Введите существующие группы, разделяя их запятыми
    vi: Nhập các nhóm đã tồn tại, phân tách bằng dấu phẩy
    zh-hant: 請輸入使用者組，多個使用者組使用逗號分隔（需填寫已存在的使用者組）
  Params groups label:
    zh: '用户组'
    ja: 'グループ'
    en: 'Groups'
    es: Grupos
    ko: 그룹
    pt-br: Grupos
    ru: Группы
    vi: Nhóm
    zh-hant: 使用者組
