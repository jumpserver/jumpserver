- hosts: demo
  gather_facts: no
  tasks:
    - name: "Check if {{ account.username }} user exists"
      ansible.builtin.command:
        argv:
          - lsuser
          - -c
          - -a
          - id
          - ALL
      register: user_info
      changed_when: false

    - name: Record whether the user exists
      ansible.builtin.set_fact:
        user_exists: >-
          {{ account.username in
             (user_info.stdout_lines[1:]
              | map('regex_replace', ':.*$', '') | list) }}

    - name: "Add {{ account.username }} user"
      ansible.builtin.user:
        name: "{{ account.username }}"
        uid: "{{ params.uid | int if params.uid | length > 0 else omit }}"
        shell: "{{ params.shell if params.shell | length > 0 else omit }}"
        home: "{{ params.home if params.home | length > 0 else '/home/' + account.username }}"
        group: "{{ params.group if params.group | length > 0 else omit }}"
        groups: "{{ params.groups if params.groups | length > 0 else omit }}"
        append: "{{ true if params.groups | length > 0 else false }}"
        expires: -1
        state: present
      when: not user_exists

    - name: "Set {{ account.username }} sudo setting"
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        state: present
        regexp: "^{{ account.username }} ALL="
        line: "{{ account.username + ' ALL=(ALL) NOPASSWD: ' + params.sudo }}"
        validate: visudo -cf %s
      when:
        - not user_exists or params.modify_sudo
        - params.sudo

    - name: "Change {{ account.username }} password"
      ansible.builtin.command: chpasswd -c
      args:
        stdin: "{{ account.username }}:{{ account.secret }}"
      ignore_errors: true
      register: change_secret_result
      when: account.secret_type == "password"
      no_log: true

    - name: "Refresh passwd data for {{ account.username }}"
      ansible.builtin.command:
        argv:
          - lsuser
          - -c
          - -a
          - home
          - pgrp
          - "{{ account.username }}"
      register: account_passwd
      changed_when: false
      when: account.secret_type == "ssh_key"

    - name: "Record home and primary group for {{ account.username }}"
      ansible.builtin.set_fact:
        account_home: >-
          {{ account_passwd.stdout_lines[-1].split(':')[1] }}
        account_primary_group: >-
          {{ account_passwd.stdout_lines[-1].split(':')[2] }}
      when: account.secret_type == "ssh_key"

    - name: "Check if home directory exists for {{ account.username }}"
      ansible.builtin.stat:
        path: "{{ account_home }}"
      register: home_dir_stat
      when: account.secret_type == "ssh_key"

    - name: "Ensure {{ account.username }} home directory exists"
      ansible.builtin.file:
        path: "{{ account_home }}"
        state: directory
        owner: "{{ account.username }}"
        group: "{{ account_primary_group }}"
        mode: '0750'
      when:
        - account.secret_type == "ssh_key"
        - not (home_dir_stat.stat.exists | default(false))

    - name: Remove ssh key created by system
      ansible.builtin.lineinfile:
        dest: "{{ account_home }}/.ssh/authorized_keys"
        regexp: "{{ ssh_params.regexp }}"
        state: absent
      when:
        - account.secret_type == "ssh_key"
        - ssh_params.strategy == "set_jms"
      ignore_errors: yes

    - name: "Change {{ account.username }} SSH key"
      ansible.builtin.authorized_key:
        user: "{{ account.username }}"
        key: "{{ account.secret }}"
        exclusive: "{{ ssh_params.exclusive }}"
      register: change_secret_result
      when: account.secret_type == "ssh_key"

    - name: "Verify {{ account.username }} password (paramiko)"
      ssh_ping:
        login_user: "{{ account.username }}"
        login_password: >-
          {{ account.secret if account.secret_type == 'password' else '' }}
        login_secret_type: "{{ account.secret_type }}"
        login_private_key_path: "{{ account.private_key_path }}"
        login_host: "{{ jms_asset.address }}"
        login_port: "{{ jms_asset.port }}"
        gateway_args: "{{ jms_asset.ansible_ssh_common_args | default(None) }}"
        become: "{{ account.become.ansible_become | default(False) }}"
        become_method: su
        become_user: "{{ account.become.ansible_user | default('') }}"
        become_password: "{{ account.become.ansible_password | default('') }}"
        become_private_key_path: "{{ account.become.ansible_ssh_private_key_file | default(None) }}"
        old_ssh_version: "{{ jms_asset.old_ssh_version | default(False) }}"
        auth_only: true
        fail_on_unknown: false
        change_succeeded: "{{ not (change_secret_result.failed | default(false)) }}"
      when:
       - account.secret_type == "password"
       - check_conn_after_change or change_secret_result.failed | default(false)
      connection: local
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ local_python_interpreter }}"

    - name: "Verify {{ account.username }} SSH KEY (paramiko)"
      ssh_ping:
        login_host: "{{ jms_asset.address }}"
        login_port: "{{ jms_asset.port }}"
        login_user: "{{ account.username }}"
        login_private_key_path: "{{ account.private_key_path  }}"
        gateway_args: "{{ jms_asset.ansible_ssh_common_args | default(None) }}"
        old_ssh_version: "{{ jms_asset.old_ssh_version | default(False) }}"
        auth_only: true
        fail_on_unknown: false
        change_succeeded: "{{ not (change_secret_result.failed | default(false)) }}"
      when:
       - account.secret_type == "ssh_key"
       - check_conn_after_change or change_secret_result.failed | default(false)
      delegate_to: localhost
      connection: local
      vars:
        ansible_python_interpreter: "{{ local_python_interpreter }}"
