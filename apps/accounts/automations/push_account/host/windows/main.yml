- hosts: demo
  gather_facts: no
  tasks:
    - name: Check whether the Windows account exists
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $user = Get-LocalUser | Where-Object {
          $_.Name -eq $env:JMS_ACCOUNT_USERNAME
        }
        if ($null -ne $user) { 'true' } else { 'false' }
      environment:
        JMS_ACCOUNT_USERNAME: "{{ account.username }}"
      register: windows_account_lookup
      changed_when: false
      when: require_absent | default(false) | bool

    - name: Refuse to overwrite an existing account
      ansible.builtin.fail:
        msg: "JMS_CREDENTIAL_ACCOUNT_EXISTS: {{ account.username }}"
      when:
        - require_absent | default(false) | bool
        - windows_account_lookup.stdout | default('false') | trim == 'true'

    - name: Push user password
      ansible.windows.win_user:
        fullname: "{{ account.username}}"
        name: "{{ account.username }}"
        password: "{{ account.secret }}"
        password_never_expires: yes
        groups: "{{ params.groups }}"
        groups_action: add
        update_password: >-
          {{ 'on_create'
             if (require_absent | default(false) | bool)
             else 'always' }}
      ignore_errors: true
      when: account.secret_type == "password"
      register: change_secret_result

    - name: Refresh connection
      ansible.builtin.meta: reset_connection

    - name: Verify password (win_ping)
      ansible.windows.win_ping:
      vars:
        ansible_user: "{{ account.username }}"
        ansible_password: "{{ account.secret }}"
      when:
        - account.secret_type == "password"
        - check_conn_after_change or change_secret_result.failed | default(false)
      register: verify_winping
      ignore_errors: true
      ignore_unreachable: true

    - name: Verify password (pyfreerdp)
      rdp_ping:
        login_host: "{{ jms_asset.origin_address }}"
        login_port: "{{ jms_asset.protocols | selectattr('name', 'equalto', 'rdp') | map(attribute='port') | first | default(3389, true) }}"
        login_user: "{{ account.full_username }}"
        login_password: "{{ account.secret }}"
        login_secret_type: "{{ account.secret_type }}"
        gateway_args: "{{ jms_gateway | default({}) }}"
        connect_timeout: 30
      when:
        - account.secret_type == "password"
        - check_conn_after_change or change_secret_result.failed | default(false)
        - verify_winping is not defined
          or (verify_winping.unreachable | default(false))
          or (verify_winping.failed | default(false))
      vars:
        ansible_connection: local
        ansible_shell_type: sh
        ansible_python_interpreter: "{{ local_python_interpreter }}"
      delegate_to: 127.0.0.1
      connection: local
      register: verify_rdp
      ignore_errors: true

    - name: Mark Windows verification as inconclusive
      ansible.builtin.set_fact:
        jms_credential_probe:
          auth_status: unknown
          reason_code: WINDOWS_VERIFY_FAILED
          change_succeeded: true
      when:
        - not (change_secret_result.failed | default(false))
        - verify_winping.failed | default(false)
          or verify_winping.unreachable | default(false)
        - verify_rdp.failed | default(false)
          or verify_rdp.unreachable | default(false)

    - name: Fail when Windows push and verification both fail
      ansible.builtin.fail:
        msg: "Windows account push failed: {{ change_secret_result.msg | default('unknown error') }}"
      when:
        - change_secret_result.failed | default(false)
        - verify_winping.failed | default(false)
          or verify_winping.unreachable | default(false)
        - verify_rdp.failed | default(false)
          or verify_rdp.unreachable | default(false)
