- hosts: demo
  gather_facts: no
  tasks:
    - name: Gather local Windows accounts as JSON
      win_shell: |
        $ErrorActionPreference = 'Stop'
        $groupMap = @{}

        Get-LocalGroup | ForEach-Object {
          $groupName = $_.Name
          try {
            Get-LocalGroupMember -Group $groupName -ErrorAction Stop |
              ForEach-Object {
                $localPrefix = "$env:COMPUTERNAME$([char]92)"
                if (-not $_.Name.StartsWith(
                  $localPrefix,
                  [System.StringComparison]::OrdinalIgnoreCase
                )) {
                  return
                }
                $memberName = $_.Name.Substring($localPrefix.Length)
                if (-not $groupMap.ContainsKey($memberName)) {
                  $groupMap[$memberName] = @()
                }
                $groupMap[$memberName] += $groupName
              }
          } catch [Microsoft.PowerShell.Commands.PrincipalNotFoundException] {
          }
        }

        $users = Get-LocalUser | ForEach-Object {
          $username = $_.Name
          [PSCustomObject]@{
            UserName = $username
            Enabled = $_.Enabled
            PasswordLastSet = if ($_.PasswordLastSet) {
              $_.PasswordLastSet.ToString('o')
            } else { $null }
            PasswordExpires = if ($_.PasswordExpires) {
              $_.PasswordExpires.ToString('o')
            } else { $null }
            LastLogon = if ($_.LastLogon) {
              $_.LastLogon.ToString('o')
            } else { $null }
            GlobalGroupMemberships = @($groupMap[$username])
          }
        }

        ConvertTo-Json -InputObject @($users) -Depth 4 -Compress
      register: local_users
      changed_when: false

    - name: Define gathered account info
      ansible.builtin.set_fact:
        info:
          user_details: "{{ local_users.stdout | from_json }}"
