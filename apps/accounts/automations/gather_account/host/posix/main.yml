- hosts: demo
  gather_facts: no
  tasks:
    - name: Get users
      ansible.builtin.shell:
        cmd: >
          getent passwd | awk -F: '$7 !~ /(false|nologin|true|sync|shutdown|halt|poweroff|reboot)$/' | grep -v '^$' | awk -F":" '{ print $1 }'
      register: users
      changed_when: false

    - name: Gather posix account last login
      ansible.builtin.shell: |
        for user in {{ users.stdout_lines | map('quote') | join(" ") }}; do
          last -wi --time-format iso -n 1 "$user" | awk '{ print $1,$3,$4, $NF }' | head -1 | awk 'NF'
        done
      register: last_login
      changed_when: false

    - name: Get user password change date and expiry
      ansible.builtin.shell: |
        for user in {{ users.stdout_lines | map('quote') | join(" ") }}; do
          k=$(getent shadow "$user" | awk -F: '{ print $3, $5 }')
          echo "$user:$k"
        done
      register: passwd_date
      changed_when: false

    - name: Get user groups
      ansible.builtin.shell: |
        for user in {{ users.stdout_lines | map('quote') | join(" ") }}; do
          echo "$(groups "$user")" | sed 's@ : @:@g'
        done
      register: user_groups
      changed_when: false

    - name: Get sudoers
      ansible.builtin.shell: |
        for user in {{ users.stdout_lines | map('quote') | join(" ") }}; do
          echo -n "$user: "
          for sudo_file in /etc/sudoers /etc/sudoers.d/*; do
            [ -f "$sudo_file" ] || continue
            awk -v username="$user" '$1 == username' "$sudo_file"
          done | tr '\n' ';'
          echo
        done
      register: user_sudo
      changed_when: false

    - name: Get authorized keys
      ansible.builtin.shell: |
        for user in {{ users.stdout_lines | map('quote') | join(" ") }}; do
          home=$(getent passwd "$user" | cut -d: -f6)
          echo -n "$user:"
          if [ -f "${home}/.ssh/authorized_keys" ]; then
            cat "${home}/.ssh/authorized_keys" | tr '\n' ';'
          fi
          echo
        done
      register: user_authorized
      changed_when: false

    - set_fact:
        info:
          users: "{{ users.stdout_lines }}"
          last_login: "{{ last_login.stdout_lines }}"
          user_groups: "{{ user_groups.stdout_lines }}"
          user_sudo: "{{ user_sudo.stdout_lines }}"
          user_authorized: "{{ user_authorized.stdout_lines }}"
          passwd_date: "{{ passwd_date.stdout_lines }}"
