id: change_secret_mysql
name: "{{ 'MySQL account change secret' | trans }}"
category: database
type:
  - mysql
  - mariadb
method: change_secret
params:
  - name: account_host
    type: str
    label: MySQL account host
    default: "%"
    help_text: Host part of the MySQL account identity
  - name: all_hosts
    type: bool
    label: Apply to all hosts
    default: false
    help_text: Apply the operation to every Host entry with this username

i18n:
  MySQL account change secret:
    zh: 使用 Ansible 模块 mysql 执行 MySQL 账号改密
    ja: Ansible mysql モジュールを使用して MySQL アカウントのパスワード変更
    en: Using Ansible module mysql to change MySQL account secret
