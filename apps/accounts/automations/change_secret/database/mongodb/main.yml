- hosts: mongodb
  gather_facts: no
  vars:
    ansible_python_interpreter: "{{ local_python_interpreter }}"

  tasks:
    - name: Change MongoDB password
      mongodb_user:
        login_user: "{{ jms_account.username }}"
        login_password: "{{ jms_account.secret }}"
        login_host: "{{ jms_asset.address }}"
        login_port: "{{ jms_asset.port }}"
        login_database: "{{ jms_asset.mongodb_auth_source }}"
        ssl: "{{ jms_asset.spec_info.use_ssl }}"
        ssl_ca_certs: "{{ jms_asset.secret_info.ca_cert | default('') }}"
        ssl_certfile: >-
          {{ jms_asset.secret_info.client_cert_key
             | default(jms_asset.secret_info.client_key | default('')) }}
        connection_options: "{{ jms_asset.mongodb_connection_options }}"
        db: "{{ jms_asset.mongodb_auth_source }}"
        role_database: "{{ jms_asset.spec_info.db_name }}"
        name: "{{ account.username }}"
        password: "{{ account.secret }}"
        create_roles: "{{ (params.roles | default('readWrite')).split(',') }}"
      ignore_errors: true
      register: change_secret_result

    - name: Verify password
      mongodb_ping:
        login_user: "{{ account.username }}"
        login_password: "{{ account.secret }}"
        login_host: "{{ jms_asset.address }}"
        login_port: "{{ jms_asset.port }}"
        login_database: "{{ jms_asset.mongodb_auth_source }}"
        ssl: "{{ jms_asset.spec_info.use_ssl }}"
        ssl_ca_certs: "{{ jms_asset.secret_info.ca_cert | default('') }}"
        ssl_certfile: >-
          {{ jms_asset.secret_info.client_cert_key
             | default(jms_asset.secret_info.client_key | default('')) }}
        connection_options: "{{ jms_asset.mongodb_connection_options }}"
      when: check_conn_after_change or change_secret_result.failed | default(false)
      register: verify_secret_result
      failed_when: not verify_secret_result.is_available
      ignore_errors: true

    - name: Mark MongoDB verification as inconclusive
      ansible.builtin.set_fact:
        jms_credential_probe:
          auth_status: unknown
          reason_code: MONGODB_VERIFY_FAILED
          change_succeeded: true
      when:
        - not (change_secret_result.failed | default(false))
        - verify_secret_result.failed | default(false)

    - name: Fail when MongoDB change and verification both fail
      ansible.builtin.fail:
        msg: "MongoDB password change failed: {{ change_secret_result.msg | default('unknown error') }}"
      when:
        - change_secret_result.failed | default(false)
        - verify_secret_result.failed | default(false)
