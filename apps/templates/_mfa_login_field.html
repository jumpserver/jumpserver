{% load i18n %}
{% load static %}
<script src="{% static 'js/mToken.js' %}"></script>

<select id="mfa-select" name="mfa_type" class="form-control select-con"
        onchange="selectChange(this.value)"
>
    {% for backend in mfa_backends %}
    <option value="{{ backend.name }}"
            {% if not backend.is_active %} disabled {% endif %}
    >
        {{ backend.display_name }}
    </option>
    {% endfor %}
</select>
<div class="mfa-div">
    {% for backend in mfa_backends %}
    <div id="mfa-{{ backend.name }}" class="mfa-field
            {% if backend.challenge_required %}challenge-required{% endif %}"
         style="display: none"
    >
        {% if backend.name == 'usbkey' %}
        <input type="password" id="usbkey-pin" class="form-control input-style usbkey-pin"
               placeholder="{% trans 'Key PIN code' %}">
        <input type="hidden" id="usbkey-code" class="input-style usbkey-code">
        <button class="btn btn-primary full-width btn-challenge"
                type='button' onclick="signUSBKeyChallenge(this)"
        >
            {% trans 'Confirm' %}
        </button>
        {% elif backend.has_code %}
        <input type="text" class="form-control input-style"
               placeholder="{{ backend.placeholder }}"
        >
        {% if backend.challenge_required %}
        <button class="btn btn-primary full-width btn-challenge"
                type='button' onclick="sendChallengeCode(this)"
        >
            {% trans 'Send' %}
        </button>
        {% endif %}
        {% endif %}
    </div>
    {% endfor %}
</div>

<style>
    .input-style {
        width: 100%;
        display: inline-block;
    }

    .challenge-required .input-style {
        width: calc(100% - 104px);
        display: inline-block;
    }

    .usbkey-code {
        display: none;
    }

    .btn-challenge {
        width: 100px !important;
        height: 100%;
        vertical-align: top;
    }
</style>
<script>
    const preferMFAKey = 'mfaPrefer'
    const usbkeyMFAType = 'usbkey'
    const usbkeyToken = new mToken("mTokenPlugin")

    $(document).ready(function () {
        const mfaSelectRef = document.getElementById('mfa-select');
        const preferMFA = localStorage.getItem(preferMFAKey);
        const valueSelector = "value=" + preferMFA
        const preferMFADisabled = $(`#mfa-select option[${valueSelector}]`).attr('disabled')

        if (preferMFA && !preferMFADisabled) {
            mfaSelectRef.value = preferMFA;
        }

        const mfaSelect = mfaSelectRef.value;
        if (mfaSelect !== null) {
            selectChange(mfaSelect, true);
        }
    })

    function selectChange(name, onLoad) {
        $('.mfa-field').hide()
        $('#mfa-' + name).show()
        if (!onLoad) {
            localStorage.setItem(preferMFAKey, name)
        }



        const currentMFAInputRef = $('#mfa-' + name + ' .input-style').last()
        currentMFAInputRef.attr('name', 'code')

        const usernameRef = $('input[name="username"]')
        if (!usernameRef || usernameRef.length === 0) {
            setTimeout(() => {
                const focusRef = name === usbkeyMFAType ? $('#usbkey-pin') : currentMFAInputRef
                focusRef.focus()
            })
        }
    }

    function enumUSBKeyDevice() {
        let ret = usbkeyToken.SOF_LoadLibrary(usbkeyToken.GM3000)
        if (ret !== 0) {
            toastr.error("{% trans 'Failed to load plugin, error code: ' %}" + usbkeyToken.SOF_GetLastError())
            return null
        }
        const deviceName = usbkeyToken.SOF_EnumDevice();
        if (deviceName == null) {
            toastr.error("{% trans 'No USB Key found' %}")
            return null
        }
        ret = usbkeyToken.SOF_GetDeviceInstance(deviceName[0], "");
        if (ret !== 0) {
            toastr.error("{% trans 'Failed to bind application, please check if the Key is initialized, error code: ' %}" + usbkeyToken.SOF_GetLastError())
            return null
        }
        return deviceName
    }

    function requestMFAChallenge(onSuccess, onError) {
        const data = {
            type: $("#mfa-select").val(),
            username: $('input[name="username"]').val()
        };
        requestApi({
            url: "{% url 'api-auth:mfa-select' %}",
            method: "POST",
            body: JSON.stringify(data),
            success: onSuccess,
            error: onError,
            flash_message: false
        })
    }

    function signUSBKeyChallenge(currentBtn) {
        const device = enumUSBKeyDevice()
        if (device == null) {
            return
        }
        const pin = $('#usbkey-pin').val()
        let ret = usbkeyToken.SOF_Login(pin)
        if (ret !== 0) {
            toastr.error("{% trans 'Failed to verify user password, error code: ' %}" + usbkeyToken.SOF_GetLastError())
            return
        }

        function onSuccess(responseJson) {
            const challenge = responseJson.challenge
            if (!challenge) {
                toastr.error("{% trans 'Failed to get challenge' %}")
                return
            }
            let container = usbkeyToken.SOF_EnumCertContiner().split("||");
            if (container.length === 0 || !container[0]) {
                toastr.error("{% trans 'No container found, error code: ' %}" + usbkeyToken.SOF_GetLastError())
                return
            }
            usbkeyToken.SOF_SetDigestMethod(1);
            usbkeyToken.SOF_SetUserID('1234567812345678');
            let challengeB64 = _Base64encode(challenge)
            let signed = usbkeyToken.SOF_SignData(container[0], 1, challengeB64, challenge.length, 0);
            if (typeof signed !== 'string' || signed === '' || signed[0] === '-') {
                toastr.error("{% trans 'Signature failed, error code: ' %}" + usbkeyToken.SOF_GetLastError())
                return
            }
            let digest = usbkeyToken.SOF_DigestData(container[0], challengeB64, challenge.length);
            if (typeof digest !== 'string' || digest === '' || digest[0] === '-') {
                toastr.error("{% trans 'Data digest failed, error code: ' %}" + usbkeyToken.SOF_GetLastError())
                return
            }
            const payload = {
                serial: device[0],
                digest: digest,
                signature: signed
            }
            $('#usbkey-code').val(encodeURIComponent(JSON.stringify(payload)))
            toastr.success("{% trans 'USBKey signature generated' %}")
        }

        function onError(responseText, responseJson, status) {
            toastr.error((responseJson && (responseJson.detail || responseJson.error)) || responseText)
        }

        requestMFAChallenge(onSuccess, onError)
    }

    function sendChallengeCode(currentBtn) {
        if ($("#mfa-select").val() === usbkeyMFAType) {
            signUSBKeyChallenge(currentBtn)
            return
        }

        let time = 60;

        function onSuccess() {
            const originBtnText = currentBtn.innerHTML;
            currentBtn.disabled = true

            const interval = setInterval(function () {
                currentBtn.innerHTML = `{% trans 'Wait: ' %} ${time}`;
                time -= 1

                if (time === 0) {
                    currentBtn.innerHTML = originBtnText
                    currentBtn.disabled = false
                    clearInterval(interval)
                }
            }, 1000)
            setTimeout(function () {
                toastr.success("{% trans 'The verification code has been sent' %}");
            })
        }

        function onError(responseText, responseJson, status) {
            setTimeout(function () {
                toastr.error(responseJson.detail || responseJson.error);
            });
        };

        requestMFAChallenge(onSuccess, onError)
    }
</script>
