---
- hosts: all
  become: true
  gather_facts: false
  vars:
    APP_IMAGE: ''

  tasks:
    - name: Read Docker platform
      ansible.builtin.command:
        argv: [docker, version, --format, '{{ "{{.Server.Os}}/{{.Server.Arch}}" }}']
      register: docker_platform
      changed_when: false

    - name: Inspect local application image
      ansible.builtin.command:
        argv: [docker, image, inspect, '{{ APP_IMAGE }}']
        expand_argument_vars: false
      register: local_image
      changed_when: false
      failed_when: false

    - name: Read local application image
      ansible.builtin.set_fact:
        app_image: '{{ (local_image.stdout | from_json | first) if local_image.rc == 0 else {} }}'

    - name: Prepare application image for the Docker platform
      when: app_image.get('Os', '') ~ '/' ~ app_image.get('Architecture', '') != docker_platform.stdout | trim
      block:
        - name: Pull matching application image
          ansible.builtin.command:
            argv: [docker, pull, --platform, '{{ docker_platform.stdout | trim }}', '{{ APP_IMAGE }}']
            expand_argument_vars: false
          async: 900
          poll: 5

        - name: Inspect pulled application image
          ansible.builtin.command:
            argv: [docker, image, inspect, '{{ APP_IMAGE }}']
            expand_argument_vars: false
          register: pulled_image
          changed_when: false

        - name: Read pulled application image
          ansible.builtin.set_fact:
            app_image: '{{ pulled_image.stdout | from_json | first }}'

    - name: Confirm application image platform
      ansible.builtin.assert:
        that: app_image.get('Os', '') ~ '/' ~ app_image.get('Architecture', '') == docker_platform.stdout | trim
        fail_msg: 'Application image {{ APP_IMAGE }} does not match Docker platform {{ docker_platform.stdout | trim }}'
