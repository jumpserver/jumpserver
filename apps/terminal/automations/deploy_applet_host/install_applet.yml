---

- hosts: all
  vars:
    applet_name: weblite

  tasks:
    - name: Install applet
      ansible.windows.win_powershell:
        script: |
          & "$env:ProgramFiles\Tinker\tinkerd.exe" install --name {{ applet_name }}
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
              Write-Host "Failed to install {{ applet_name }}"
              Write-Host "Exit code: $exitCode"
              $Ansible.Failed = $true
              exit 1
          }
      when: applet_name != 'all'
