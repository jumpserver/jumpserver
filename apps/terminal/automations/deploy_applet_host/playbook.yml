---
- hosts: all
  vars:
    APPLET_DOWNLOAD_HOST: https://demo.example.com
    IGNORE_VERIFY_CERTS: false
    HOST_ID: 00000000-0000-0000-0000-000000000000
    CORE_HOST: https://demo.example.com
    RDS_Licensing: false
    RDS_LicenseServer: 127.0.0.1
    RDS_LicensingMode: 4
    RDS_fSingleSessionPerUser: 1
    RDS_MaxDisconnectionTime: 60000
    RDS_RemoteAppLogoffTimeLimit: 0
    INSTALL_APPLETS: true
    PYTHON_VERSION: 3.11.11

  tasks:
    - block:
        - name: Check if CORE_HOST is redirects
          ansible.windows.win_uri:
            url: "{{ CORE_HOST }}"
            method: GET
            follow_redirects: none
            status_code: [ 200, 301, 302, 303, 307, 308 ]
            validate_certs: "{{ not IGNORE_VERIFY_CERTS }}"
          register: core_host_redirects

        - name: Check failed
          fail:
            msg: "CORE_HOST {{ CORE_HOST }} is redirecting to {{ core_host_redirects.location }}, please use the final url"
          when: core_host_redirects.status_code >= 300 and core_host_redirects.status_code < 400

        - name: Download Tinker installer
          ansible.windows.win_get_url:
            url: "{{ APPLET_DOWNLOAD_HOST }}/download/applets/Tinker_Installer_{{ TINKER_VERSION }}.exe"
            dest: "{{ ansible_env.TEMP }}\\Tinker_Installer_{{ TINKER_VERSION }}.exe"
            validate_certs: "{{ not IGNORE_VERIFY_CERTS }}"

        - name: Download python-{{ PYTHON_VERSION }}
          ansible.windows.win_get_url:
            url: "{{ APPLET_DOWNLOAD_HOST }}/download/applets/jumpserver-tinker-python-{{ PYTHON_VERSION }}-win64.zip"
            dest: "{{ ansible_env.TEMP }}\\jumpserver-tinker-python-{{ PYTHON_VERSION }}-win64.zip"
            validate_certs: "{{ not IGNORE_VERIFY_CERTS }}"

      tags: [prepare]
      rescue:
        - fail:
            msg: "Failed to prepare applet host; existing Tinker was not stopped"

    - block:
        - name: Install RDS-RD-Server (RDS)
          ansible.windows.win_feature:
            name: RDS-RD-Server
            state: present
            include_management_tools: yes
          register: rds_install

        # Run setup on every deployment, including a repair of the same version.
        # The installer owns service/file cleanup and leaves the service stopped
        # until the Core-created credentials have been imported.
        - name: Install Tinker
          ansible.windows.win_command:
            argv:
              - "{{ ansible_env.TEMP }}\\Tinker_Installer_{{ TINKER_VERSION }}.exe"
              - /VERYSILENT
              - /SUPPRESSMSGBOXES
              - /NORESTART
              - /NOSTART=1

        - name: Install the python-{{ PYTHON_VERSION }}
          community.windows.win_unzip:
            src: "{{ ansible_env.TEMP }}\\jumpserver-tinker-python-{{ PYTHON_VERSION }}-win64.zip"
            dest: "%ProgramFiles%\\JumpServer\\applications"

        - name: Check and Clean global system path (Python)
          ansible.windows.win_path:
            elements:
              - 'C:\Program Files\Python310\Scripts'
              - 'C:\Program Files\Python310'
              - 'C:\Program Files\Python311\Scripts'
              - 'C:\Program Files\Python311'
            state: absent

        - name: Set python-{{ PYTHON_VERSION }} on the global system path
          ansible.windows.win_path:
            elements:
              - '%ProgramFiles%\JumpServer\applications\Python'
              - '%ProgramFiles%\JumpServer\applications\Python\Scripts'

        - name: Set python-{{ PYTHON_VERSION }} on the global system python path
          ansible.windows.win_path:
            name: PYTHONPATH
            scope: machine
            elements:
              - '%ProgramFiles%\JumpServer\applications\Python\packages'
              - '%ProgramFiles%\JumpServer\applications\Python\Lib\site-packages'

        - name: Reboot if installing requires it
          ansible.windows.win_reboot:
            post_reboot_delay: 10
            test_command: whoami
          when: rds_install.reboot_required

        - name: Verify Tinker RDP settings after reboot
          ansible.windows.win_powershell:
            script: |
              $ErrorActionPreference = 'Stop'
              & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                -File "$env:ProgramFiles\Tinker\native\rdp-settings.ps1"
              if ($LASTEXITCODE -ne 0) { throw 'Unable to configure RDP for Tinker ticket login after reboot.' }
          when: rds_install.reboot_required

        - name: Set RDS LicenseServer (regedit)
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
            name: LicenseServers
            data: "{{ RDS_LicenseServer }}"
            type: string
          when: RDS_Licensing

        - name: Set RDS LicensingMode (regedit)
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
            name: LicensingMode
            data: "{{ RDS_LicensingMode }}"
            type: dword
          when: RDS_Licensing

        - name: Set RDS fSingleSessionPerUser (regedit)
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
            name: fSingleSessionPerUser
            data: "{{ RDS_fSingleSessionPerUser }}"
            type: dword
          when: RDS_Licensing

        - name: Set RDS MaxDisconnectionTime (regedit)
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
            name: MaxDisconnectionTime
            data: "{{ RDS_MaxDisconnectionTime }}"
            type: dword
          when: RDS_MaxDisconnectionTime >= 60000

        - name: Set RDS RemoteAppLogoffTimeLimit (regedit)
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
            name: RemoteAppLogoffTimeLimit
            data: "{{ RDS_RemoteAppLogoffTimeLimit }}"
            type: dword

      tags: [install]
      rescue:
        - fail:
            msg: "Failed to install Tinker; existing Core component credentials were retained. Check the installer log and retry."

    - block:
        - name: Configure Tinker and import its component key
          ansible.windows.win_powershell:
            parameters:
              Configuration: >-
                {{ {'name': HOST_NAME, 'core_host': CORE_HOST,
                    'host_id': HOST_ID,
                    'access_key': TINKER_ACCESS_KEY} | to_json }}
            script: |
              param([string]$Configuration)
              $ErrorActionPreference = 'Stop'
              $process = [Diagnostics.Process]::new()
              $process.StartInfo.FileName = Join-Path $env:ProgramFiles 'Tinker\tinkerd.exe'
              $process.StartInfo.Arguments = 'config --stdin'
              $process.StartInfo.UseShellExecute = $false
              $process.StartInfo.CreateNoWindow = $true
              $process.StartInfo.RedirectStandardInput = $true
              $process.StartInfo.RedirectStandardError = $true
              try {
                if (-not $process.Start()) { throw 'Unable to start Tinker configuration.' }
                $process.StandardInput.Write($Configuration)
                $process.StandardInput.Close()
                $details = $process.StandardError.ReadToEnd()
                $process.WaitForExit()
                if ($process.ExitCode -ne 0) { throw "Tinker configuration failed: $details" }
              } finally { $process.Dispose() }
          no_log: true

        - name: Start tinkerd service
          ansible.windows.win_powershell:
            script: |
              & "$env:ProgramFiles\Tinker\tinkerd.exe" service start
              if ($LASTEXITCODE -ne 0) { throw "Tinker service startup failed: $LASTEXITCODE" }

        - name: Wait Tinker api health
          ansible.windows.win_uri:
            url: http://localhost:6068/api/health/
            status_code: 200
            method: GET
          register: _result
          until: _result.status_code == 200
          retries: 30
          delay: 5

        - name: Sync all remote applets
          ansible.windows.win_powershell:
            script: |
              & "$env:ProgramFiles\Tinker\tinkerd.exe" install all
              $exitCode = $LASTEXITCODE
              if ($exitCode -ne 0) {
                  Write-Output "Failed to install applets"
                  Write-Output "Exit code: $exitCode"
                  $Ansible.Failed = $true
                  exit 1
              }
          register: sync_remote_applets
          when: INSTALL_APPLETS

      tags: [deploy]
      rescue:
        - fail:
            msg: "Failed to deploy applet host"
