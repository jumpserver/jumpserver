---
- hosts: all
  vars:
    APPLET_DOWNLOAD_HOST: https://demo.example.com
    IGNORE_VERIFY_CERTS: true
    HOST_ID: 00000000-0000-0000-0000-000000000000
    CORE_HOST: https://demo.example.com
    RDS_LICENSE_SERVER: ''
    PYTHON_VERSION: 3.11.11

  tasks:
    - block:
        - name: Check CORE_HOST without redirects
          ansible.windows.win_uri:
            url: "{{ CORE_HOST }}"
            method: GET
            follow_redirects: none
            status_code: 200
            validate_certs: "{{ not IGNORE_VERIFY_CERTS }}"

        - name: Download current Tinker installer
          ansible.windows.win_get_url:
            url: "{{ APPLET_DOWNLOAD_HOST }}/download/applets/Tinker_Installer_{{ TINKER_VERSION }}.exe?deployment={{ DEPLOYMENT_ID }}"
            dest: "{{ ansible_env.TEMP }}\\Tinker_Installer_{{ TINKER_VERSION }}.exe"
            force: true
            checksum_algorithm: sha256
            validate_certs: "{{ not IGNORE_VERIFY_CERTS }}"
          register: tinker_installer

        - name: Record Tinker installer SHA256
          ansible.builtin.debug:
            msg: "Tinker installer SHA256={{ tinker_installer.checksum_dest }}"

        - name: Download python-{{ PYTHON_VERSION }}
          ansible.windows.win_get_url:
            url: "{{ APPLET_DOWNLOAD_HOST }}/download/applets/jumpserver-tinker-python-{{ PYTHON_VERSION }}-win64.zip"
            dest: "{{ ansible_env.TEMP }}\\jumpserver-tinker-python-{{ PYTHON_VERSION }}-win64.zip"
            validate_certs: "{{ not IGNORE_VERIFY_CERTS }}"

      tags: [install]
      rescue:
        - fail:
            msg: >-
              Deployment precheck or download failed at "{{ ansible_failed_task.name }}".
              Resolve the task error and redeploy.

    - block:
        - name: Install RDS-RD-Server (RDS)
          ansible.windows.win_feature:
            name: RDS-RD-Server
            state: present
            include_management_tools: yes
          register: rds_install

        - name: Reboot after RDS role installation if required
          ansible.windows.win_reboot:
            post_reboot_delay: 10
            test_command: whoami
          when: rds_install.reboot_required

        - name: Check RDS session host connection capacity
          ansible.windows.win_powershell:
            script: |
              $ErrorActionPreference = 'Stop'
              $Ansible.Changed = $false
              $namespace = 'root/cimv2/terminalservices'
              $server = @(Get-CimInstance -Namespace $namespace -ClassName Win32_TerminalServiceSetting)
              if ($server.Count -ne 1 -or $server[0].TerminalServerMode -notin @(0, 1)) {
                  throw 'Cannot read the effective RDS Session Host operating mode.'
              }
              if ($server[0].TerminalServerMode -ne 1) {
                  throw 'RDS Session Host is not active. Check role installation and any pending reboot.'
              }
              $listener = @(Get-CimInstance -Namespace $namespace -ClassName Win32_TSNetworkAdapterSetting `
                  -Filter "TerminalName='RDP-Tcp'")
              if ($listener.Count -ne 1 -or $null -eq $listener[0].MaximumConnections -or
                  $null -eq $listener[0].PolicySourceMaximumConnections) {
                  throw 'Cannot read the effective RDP-Tcp connection limit or its policy source.'
              }
              $policySource = $listener[0].PolicySourceMaximumConnections
              $source = switch ($policySource) {
                  0 { 'Server' }
                  1 { 'Group Policy' }
                  2 { 'Default' }
                  default { "Unknown ($policySource)" }
              }
              $maximum = $listener[0].MaximumConnections
              $Ansible.Result = @{ MaximumConnections = $maximum; PolicySource = $source }
              Write-Output "RDP-Tcp MaximumConnections=$maximum; source=$source. The RDP connection limit is unchanged."
              if ($listener[0].PolicySourceMaximumConnections -eq 1) {
                  Write-Output 'Review the effective Limit number of connections policy if more concurrent sessions are needed.'
              }
          register: rds_ready
          until: rds_ready is succeeded
          retries: 30
          delay: 10

        # The new installer ends Tinker-managed sessions, uninstalls the old
        # Tinker and clears its managed runtime state before installing afresh.
        # Ordinary administrator sessions and installed applications are retained.
        # Leave the new service stopped until fresh Core credentials are imported.
        - name: Fully reinstall Tinker
          ansible.windows.win_command:
            argv:
              - "{{ ansible_env.TEMP }}\\Tinker_Installer_{{ TINKER_VERSION }}.exe"
              - /VERYSILENT
              - /SUPPRESSMSGBOXES
              - /NORESTART
              - /RESTARTEXITCODE=3010
              - /NOSTART=1
          async: 1200
          poll: 5
          register: tinker_install
          failed_when: (tinker_install.rc | default(-1)) not in [0, 3010]

        - name: Reboot after Tinker installation if required and wait for Windows
          ansible.windows.win_reboot:
            reboot_timeout: 600
            post_reboot_delay: 10
          when: tinker_install.rc == 3010

        - name: Install the python-{{ PYTHON_VERSION }}
          community.windows.win_unzip:
            src: "{{ ansible_env.TEMP }}\\jumpserver-tinker-python-{{ PYTHON_VERSION }}-win64.zip"
            dest: "%ProgramFiles%\\JumpServer\\applications"

        - name: Check and Clean global system path (Python)
          ansible.windows.win_path:
            elements:
              - 'C:\Program Files\Python310\Scripts'
              - 'C:\Program Files\Python310'
              - 'C:\Program Files\Python311\Scripts'
              - 'C:\Program Files\Python311'
            state: absent

        - name: Set python-{{ PYTHON_VERSION }} on the global system path
          ansible.windows.win_path:
            elements:
              - '%ProgramFiles%\JumpServer\applications\Python'
              - '%ProgramFiles%\JumpServer\applications\Python\Scripts'

        - name: Set python-{{ PYTHON_VERSION }} on the global system python path
          ansible.windows.win_path:
            name: PYTHONPATH
            scope: machine
            elements:
              - '%ProgramFiles%\JumpServer\applications\Python\packages'
              - '%ProgramFiles%\JumpServer\applications\Python\Lib\site-packages'

        - name: Set explicitly configured RDS license server
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services
            name: LicenseServers
            data: "{{ RDS_LICENSE_SERVER }}"
            type: string
          when: RDS_LICENSE_SERVER | default('') | trim | length > 0

      tags: [install]
      rescue:
        - fail:
            msg: >-
              Applet host installation or runtime configuration failed at "{{ ansible_failed_task.name }}".
              Resolve the task error and redeploy.

    - block:
        - name: Configure Tinker and import its component key
          ansible.windows.win_powershell:
            parameters:
              NAME: "{{ HOST_NAME }}"
              CORE_HOST: "{{ CORE_HOST }}"
              HOST_ID: "{{ HOST_ID }}"
              IGNORE_VERIFY_CERTS: "{{ IGNORE_VERIFY_CERTS | string | lower }}"
              ComponentKey: "{{ TINKER_ACCESS_KEY }}"
            script: |
              param([string]$NAME, [string]$CORE_HOST, [string]$HOST_ID,
                    [string]$IGNORE_VERIFY_CERTS, [string]$ComponentKey)
              $ErrorActionPreference = 'Stop'
              $ComponentKey | & "$env:SystemRoot\System32\config\systemprofile\AppData\Local\Tinker\tinkerd.exe" config `
                --hostname $NAME --core_host $CORE_HOST --host_id $HOST_ID `
                "--ignore-verify-certs=$IGNORE_VERIFY_CERTS" --stdin
              if ($LASTEXITCODE -ne 0) { throw "Tinker configuration failed: $LASTEXITCODE" }
          no_log: true

        - name: Start tinkerd service
          ansible.windows.win_powershell:
            script: |
              & "$env:SystemRoot\System32\config\systemprofile\AppData\Local\Tinker\tinkerd.exe" service start
              if ($LASTEXITCODE -ne 0) { throw "Tinker service startup failed: $LASTEXITCODE" }

        - name: Wait Tinker api health
          ansible.windows.win_uri:
            url: http://localhost:6068/api/health/
            status_code: 200
            method: GET
          register: _result
          until: _result.status_code == 200
          retries: 30
          delay: 5

        - name: Record running services that depend on Remote Desktop Services
          ansible.windows.win_powershell:
            script: |
              $ErrorActionPreference = 'Stop'
              $Ansible.Changed = $false
              function Get-RunningDependents($Service) {
                  foreach ($dependent in $Service.DependentServices) {
                      if ($dependent.Status -eq 'Running') {
                          $dependent.Name
                          Get-RunningDependents $dependent
                      }
                  }
              }
              $Ansible.Result = @{ Running = @(Get-RunningDependents (Get-Service -Name TermService)) }
          register: rdp_dependents

        # Restart exactly once. Only the read-only readiness check below retries.
        - name: Refresh Remote Desktop Services after Tinker is ready
          ansible.windows.win_service:
            name: TermService
            state: restarted
            force_dependent_services: true
          async: 120
          poll: 5

        - name: Restore Remote Desktop dependent services
          ansible.windows.win_service:
            name: "{{ item }}"
            state: started
          loop: "{{ (rdp_dependents.result.Running + ['UmRdpService']) | unique }}"

        - name: Verify NLA and RDP listener after the service refresh
          ansible.windows.win_powershell:
            script: |
              $ErrorActionPreference = 'Stop'
              $Ansible.Changed = $false
              $namespace = 'root/cimv2/terminalservices'
              $listenerPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
              function Assert-NLADisabled {
                  $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
                  if (Test-Path -LiteralPath $policyPath) {
                      $policy = Get-ItemProperty -LiteralPath $policyPath
                      if ($policy.UserAuthentication -eq 1) { throw 'Group Policy still requires NLA.' }
                  }
                  $local = Get-ItemProperty -LiteralPath $listenerPath
                  $effective = @(Get-CimInstance -Namespace $namespace -ClassName Win32_TSGeneralSetting `
                      -Filter "TerminalName='RDP-Tcp'")
                  if ($local.UserAuthentication -ne 0 -or $effective.Count -ne 1 -or
                      $effective[0].UserAuthenticationRequired -ne 0) {
                      throw "NLA is not disabled: registry=$($local.UserAuthentication), WMI=$($effective.UserAuthenticationRequired)."
                  }
                  return $local
              }
              $services = @(Get-Service -Name Tinker,TermService,UmRdpService)
              if (@($services | Where-Object Status -ne 'Running').Count) {
                  throw 'Tinker, TermService and UmRdpService must all be running.'
              }
              $local = Assert-NLADisabled
              $server = @(Get-CimInstance -Namespace $namespace -ClassName Win32_TerminalServiceSetting)
              if ($server.Count -ne 1 -or $server[0].AllowTSConnections -ne 1) {
                  throw 'Remote Desktop connections are not allowed.'
              }
              $port = $local.PortNumber
              if ($null -eq $port -or $port -lt 1 -or $port -gt 65535) {
                  throw 'Cannot read a valid RDP-Tcp port.'
              }
              function Read-RdpBytes([IO.Stream]$Stream, [int]$Length, [Diagnostics.Stopwatch]$Clock) {
                  $buffer = New-Object byte[] $Length
                  $offset = 0
                  while ($offset -lt $Length) {
                      $remaining = 5000 - [int]$Clock.ElapsedMilliseconds
                      if ($remaining -le 0) { throw 'RDP negotiation timed out.' }
                      $Stream.ReadTimeout = $remaining
                      $read = $Stream.Read($buffer, $offset, $Length - $offset)
                      if ($read -eq 0) { throw 'RDP listener closed an incomplete negotiation response.' }
                      $offset += $read
                  }
                  return ,$buffer
              }
              $client = [Net.Sockets.TcpClient]::new()
              $stream = $null
              $waitHandle = $null
              $clock = [Diagnostics.Stopwatch]::StartNew()
              try {
                  $pending = $client.BeginConnect('127.0.0.1', [int]$port, $null, $null)
                  $waitHandle = $pending.AsyncWaitHandle
                  if (-not $waitHandle.WaitOne(5000)) { throw 'RDP listener connection timed out.' }
                  $client.EndConnect($pending)
                  $stream = $client.GetStream()
                  $stream.WriteTimeout = [Math]::Max(1, 5000 - [int]$clock.ElapsedMilliseconds)
                  # Request TLS without CredSSP to verify that NLA is not required.
                  [byte[]]$request = 3,0,0,19,14,224,0,0,0,0,0,1,0,8,0,1,0,0,0
                  $stream.Write($request, 0, $request.Length)
                  $header = Read-RdpBytes $stream 4 $clock
                  $length = ([int]$header[2] -shl 8) -bor [int]$header[3]
                  if ($header[0] -ne 3 -or $header[1] -ne 0 -or $length -lt 19 -or $length -gt 4096) {
                      throw 'Invalid RDP TPKT response.'
                  }
                  $reply = Read-RdpBytes $stream ($length - 4) $clock
                  if ($reply[0] -ne ($length - 5) -or $reply[1] -ne 208 -or
                      [BitConverter]::ToUInt16($reply, 9) -ne 8) {
                      throw 'Invalid RDP negotiation response.'
                  }
                  $protocol = [BitConverter]::ToUInt32($reply, 11)
                  if ($reply[7] -eq 3) {
                      if ($protocol -eq 5) { throw 'RDP listener still requires NLA (HYBRID_REQUIRED_BY_SERVER).' }
                      throw "RDP negotiation failed with code $protocol."
                  }
                  if ($reply[7] -ne 2 -or $protocol -ne 1) {
                      throw 'RDP listener did not accept TLS without NLA.'
                  }
              } finally {
                  if ($stream) { $stream.Dispose() }
                  if ($waitHandle) { $waitHandle.Close() }
                  $client.Dispose()
              }
              Start-Sleep -Seconds 2
              $null = Assert-NLADisabled
              $Ansible.Result = @{ Port = $port; NLARequired = $false; NegotiatedProtocol = 'TLS' }
          register: rdp_ready
          until: rdp_ready is succeeded
          retries: 6
          delay: 5

      tags: [deploy]
      rescue:
        - fail:
            msg: >-
              Tinker configuration, startup, health or RDP readiness check failed at "{{ ansible_failed_task.name }}".
              Resolve the task error and redeploy.
